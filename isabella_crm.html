<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isabella — Relationship Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#f7f5f2; --surface:#ffffff; --surface2:#f2f0ed; --surface3:#eceae6;
    --border:#e2deda; --border2:#cdc9c3;
    --text:#1a1816; --text2:#6b6560; --text3:#a09890;
    --r1:#e85d75; --r2:#f2824a; --r3:#d4a017; --r4:#5aab5c; --r5:#4a9fd4; --r6:#8b6fd4;
    --r1d:rgba(232,93,117,.10); --r2d:rgba(242,130,74,.10); --r3d:rgba(212,160,23,.10);
    --r4d:rgba(90,171,92,.10); --r5d:rgba(74,159,212,.10); --r6d:rgba(139,111,212,.10);
    --radius:8px; --sidebar:224px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;font-size:13px;}
  /* SIDEBAR */
  .sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .logo{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
  .logo-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .logo-sub{font-size:9px;color:var(--text3);letter-spacing:.14em;text-transform:uppercase;margin-top:3px;}
  .nav{flex:1;padding:10px 0;overflow-y:auto;}
  .nav-section{padding:10px 16px 4px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:var(--text2);transition:all .15s;border-left:2px solid transparent;font-size:13px;}
  .nav-item:hover{color:var(--text);background:var(--surface2);}
  .nav-item.act-dashboard{color:var(--r1);border-left-color:var(--r1);background:var(--r1d);}
  .nav-item.act-contacts{color:var(--r2);border-left-color:var(--r2);background:var(--r2d);}
  .nav-item.act-inbound{color:var(--r3);border-left-color:var(--r3);background:var(--r3d);}
  .nav-item.act-events{color:var(--r4);border-left-color:var(--r4);background:var(--r4d);}
  .nav-item.act-classes{color:var(--r5);border-left-color:var(--r5);background:var(--r5d);}
  .nav-item.act-articles{color:var(--r6);border-left-color:var(--r6);background:var(--r6d);}
  .nav-item.act-lvmh{color:#b8860b;border-left-color:#b8860b;background:rgba(184,134,11,.10);}
  .nav-item.act-internship{color:var(--r5);border-left-color:var(--r5);background:var(--r5d);}
  .nav-item.act-cc{color:var(--r4);border-left-color:var(--r4);background:var(--r4d);}
  .badge-lv{background:linear-gradient(90deg,#b8860b,#8b6fd4);}
  .nav-icon{font-size:14px;width:18px;text-align:center;}
  .nav-badge{margin-left:auto;font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;color:#fff;}
  .badge-c{background:var(--r2);} .badge-i{background:var(--r3);}
  .sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);}
  .quick-add-btn{width:100%;padding:9px;background:linear-gradient(90deg,var(--r1),var(--r6));color:#fff;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s;}
  .quick-add-btn:hover{opacity:.85;}
  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:var(--surface);position:relative;}
  .topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6));}
  .page-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text);flex:1;}
  .search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;width:220px;}
  .search-bar input{background:none;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;width:100%;}
  .search-bar input::placeholder{color:var(--text3);}
  .content{flex:1;overflow-y:auto;padding:24px 28px;}
  /* BUTTONS */
  .btn{padding:5px 13px;border-radius:5px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;transition:all .15s;}
  .btn-primary{background:linear-gradient(90deg,var(--r1),var(--r5));color:#fff;}
  .btn-primary:hover{opacity:.85;}
  .btn-rose{background:var(--r1d);color:var(--r1);border:1px solid rgba(232,93,117,.3);}
  .btn-rose:hover{background:var(--r1);color:#fff;}
  .btn-ghost{background:none;color:var(--text3);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text2);border-color:var(--border2);}
  .btn-sm{padding:4px 10px;font-size:10px;}
  /* DASHBOARD */
  .dash-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;}
  .section-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;grid-column:1/-1;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;border-top:3px solid;}
  .stat-card:nth-child(1){border-top-color:var(--r1);} .stat-card:nth-child(2){border-top-color:var(--r3);}
  .stat-card:nth-child(3){border-top-color:var(--r5);} .stat-card:nth-child(4){border-top-color:var(--r6);}
  .stat-num{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;line-height:1;}
  .stat-card:nth-child(1) .stat-num{color:var(--r1);} .stat-card:nth-child(2) .stat-num{color:var(--r3);}
  .stat-card:nth-child(3) .stat-num{color:var(--r5);} .stat-card:nth-child(4) .stat-num{color:var(--r6);}
  .stat-label{font-size:11px;color:var(--text3);margin-top:4px;}
  /* SUGGESTIONS */
  .suggestions-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .suggestion-item{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--bg);border-left:3px solid;transition:box-shadow .15s;}
  .suggestion-item:nth-child(1){border-left-color:var(--r1);} .suggestion-item:nth-child(2){border-left-color:var(--r4);} .suggestion-item:nth-child(3){border-left-color:var(--r5);}
  .suggestion-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
  .suggestion-item.contacted{opacity:.4;}
  .sug-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;color:#fff;flex-shrink:0;font-weight:500;}
  .sug-info{flex:1;}
  .sug-name{font-weight:500;color:var(--text);font-size:13px;}
  .sug-role{font-size:11px;color:var(--text3);margin-top:1px;}
  .sug-reason{font-size:11px;color:var(--text2);background:var(--surface2);border-radius:4px;padding:6px 8px;margin-bottom:10px;line-height:1.5;}
  .sug-actions{display:flex;gap:8px;align-items:center;}
  .checkbox-wrap{display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:auto;}
  .checkbox-wrap input{accent-color:var(--r4);width:14px;height:14px;cursor:pointer;}
  .checkbox-label{font-size:11px;color:var(--text3);}
  /* INBOUND CARD */
  .inbound-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .inbound-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .1s;}
  .inbound-item:hover{opacity:.75;} .inbound-item:last-child{border-bottom:none;}
  .inbound-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-new{background:var(--r3);} .dot-active{background:var(--r4);} .dot-touch{background:var(--r5);}
  .inbound-name{font-size:13px;color:var(--text);font-weight:500;}
  .inbound-sub{font-size:11px;color:var(--text3);}
  .inbound-due{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .due-overdue{background:var(--r1d);color:var(--r1);border:1px solid rgba(232,93,117,.25);}
  .due-soon{background:var(--r3d);color:var(--r3);border:1px solid rgba(212,160,23,.3);}
  .due-ok{background:var(--r4d);color:var(--r4);border:1px solid rgba(90,171,92,.25);}
  /* UPCOMING */
  .upcoming-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;}
  .event-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .event-item:last-child{border-bottom:none;}
  .event-date-box{border-radius:6px;padding:6px 10px;text-align:center;flex-shrink:0;min-width:44px;background:var(--r5d);border:1px solid rgba(74,159,212,.2);}
  .event-month{font-size:9px;color:var(--r5);text-transform:uppercase;letter-spacing:.1em;font-weight:600;}
  .event-day{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--text);line-height:1.1;}
  .event-name{font-size:12px;color:var(--text);font-weight:500;}
  .event-loc{font-size:11px;color:var(--text3);margin-top:2px;}
  /* KANBAN */
  .kanban-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kanban-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-height:300px;border-top:3px solid;}
  .kanban-col[data-stage="to-reach"]{border-top-color:var(--r3);}
  .kanban-col[data-stage="in-conversation"]{border-top-color:var(--r2);}
  .kanban-col[data-stage="deep"]{border-top-color:var(--r1);}
  .kanban-col[data-stage="alumni"]{border-top-color:var(--r5);}
  .kanban-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .col-title{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);}
  .col-count{font-size:10px;color:var(--text3);background:var(--surface2);padding:2px 7px;border-radius:20px;}
  .contact-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
  .contact-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06);}
  .contact-card-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;}
  .contact-card-role{font-size:11px;color:var(--text3);margin-bottom:8px;}
  .contact-tags{display:flex;flex-wrap:wrap;gap:4px;}
  .tag{font-size:9px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);cursor:pointer;white-space:nowrap;}
  .t0{background:var(--r1d);color:var(--r1);border-color:rgba(232,93,117,.25);}
  .t1{background:var(--r2d);color:var(--r2);border-color:rgba(242,130,74,.25);}
  .t2{background:var(--r3d);color:var(--r3);border-color:rgba(212,160,23,.3);}
  .t3{background:var(--r4d);color:var(--r4);border-color:rgba(90,171,92,.25);}
  .t4{background:var(--r5d);color:var(--r5);border-color:rgba(74,159,212,.25);}
  .t5{background:var(--r6d);color:var(--r6);border-color:rgba(139,111,212,.25);}
  .contact-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .last-contact{font-size:10px;color:var(--text3);}
  /* TIMELINE */
  .timeline{position:relative;padding-left:28px;}
  .timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--r1),var(--r3),var(--r4),var(--r5),var(--r6));}
  .timeline-item{position:relative;margin-bottom:20px;}
  .timeline-dot{position:absolute;left:-25px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid;}
  .timeline-item:nth-child(1) .timeline-dot{border-color:var(--r1);}
  .timeline-item:nth-child(2) .timeline-dot{border-color:var(--r3);}
  .timeline-item:nth-child(3) .timeline-dot{border-color:var(--r4);}
  .timeline-item:nth-child(4) .timeline-dot{border-color:var(--r5);}
  .timeline-item:nth-child(5) .timeline-dot{border-color:var(--r6);}
  .timeline-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s;}
  .timeline-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.07);}
  .timeline-card.expanded{border-color:var(--r4);}
  .timeline-date{font-size:10px;color:var(--text3);}
  .timeline-name{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text);margin:4px 0;}
  .event-type-badge{font-size:9px;padding:3px 9px;border-radius:20px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;}
  .badge-networking{background:var(--r3d);color:var(--r3);border:1px solid rgba(212,160,23,.3);}
  .badge-panel{background:var(--r5d);color:var(--r5);border:1px solid rgba(74,159,212,.25);}
  .badge-class{background:var(--r4d);color:var(--r4);border:1px solid rgba(90,171,92,.25);}
  .badge-workshop{background:var(--r6d);color:var(--r6);border:1px solid rgba(139,111,212,.25);}
  .badge-conference{background:var(--r1d);color:var(--r1);border:1px solid rgba(232,93,117,.25);}
  .badge-other{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
  .timeline-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .timeline-body.open{display:block;}
  .attendees-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .attendee-chip{font-size:11px;padding:3px 10px;background:var(--r5d);border:1px solid rgba(74,159,212,.25);border-radius:20px;color:var(--r5);cursor:pointer;transition:all .1s;}
  .attendee-chip:hover{background:var(--r5);color:#fff;}
  .notes-text{font-size:12px;color:var(--text2);line-height:1.65;margin-top:8px;}
  /* INBOUND TABLE */
  .inbound-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .table-row{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 100px;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s;cursor:pointer;}
  .table-row:hover{background:var(--surface2);}
  .table-row.header{background:var(--surface2);cursor:default;}
  .table-row:last-child{border-bottom:none;}
  .th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-weight:500;}
  .td{font-size:12px;color:var(--text2);}
  .td-name{font-size:13px;color:var(--text);font-weight:500;}
  .status-pill{font-size:10px;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;font-weight:500;}
  .pill-new{background:var(--r3d);color:var(--r3);border:1px solid rgba(212,160,23,.3);}
  .pill-active{background:var(--r4d);color:var(--r4);border:1px solid rgba(90,171,92,.25);}
  .pill-touch{background:var(--r5d);color:var(--r5);border:1px solid rgba(74,159,212,.25);}
  /* CLASSES */
  .classes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .class-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;border-top:3px solid var(--r5);}
  .class-name{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text);margin-bottom:4px;}
  .class-prof{font-size:11px;color:var(--text3);margin-bottom:14px;}
  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:28px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.12);}
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--text);margin-bottom:20px;}
  .form-group{margin-bottom:14px;}
  .form-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;display:block;}
  .form-input,.form-select,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--r5);box-shadow:0 0 0 3px var(--r5d);}
  .form-textarea{resize:vertical;min-height:80px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;}
  .modal-close:hover{color:var(--text);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  /* DRAWER */
  .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:90;}
  .drawer-overlay.open{display:block;}
  .drawer{position:fixed;right:-480px;top:0;bottom:0;width:460px;background:var(--surface);border-left:1px solid var(--border);z-index:95;transition:right .25s ease;overflow-y:auto;padding:28px;box-shadow:-8px 0 30px rgba(0,0,0,.07);}
  .drawer.open{right:0;}
  .drawer-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .drawer-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;color:#fff;flex-shrink:0;}
  .drawer-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--text);}
  .drawer-role{font-size:12px;color:var(--text3);margin-top:2px;}
  .drawer-close{margin-left:auto;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;flex-shrink:0;}
  .drawer-section{margin-bottom:20px;}
  .drawer-section-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
  .history-item{padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;}
  .history-date{font-size:10px;color:var(--text3);margin-bottom:4px;}
  .history-note{font-size:12px;color:var(--text2);line-height:1.55;}
  .next-action-box{background:linear-gradient(135deg,var(--r1d),var(--r6d));border:1px solid rgba(232,93,117,.2);border-radius:6px;padding:12px;}
  .next-action-label{font-size:10px;color:var(--r1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;font-weight:600;}
  .next-action-text{font-size:13px;color:var(--text);}
  .next-action-date{font-size:11px;color:var(--text3);margin-top:2px;}
  /* TABS */
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab{padding:10px 20px;font-size:12px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px;}
  .tab:hover{color:var(--text2);}
  .tab.active{color:var(--r4);border-bottom-color:var(--r4);}
  /* MISC */
  .empty-state{text-align:center;padding:40px 20px;color:var(--text3);}
  .empty-state-icon{font-size:26px;margin-bottom:10px;}
  .empty-state-text{font-size:13px;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
  .fade-in{animation:fi .2s ease;}

const SB_URL = 'https://byyghgrqpnghimtmxenj.supabase.co';

async function cloudSave() {
  try {
    const payload = {
      contacts: S.contacts,
      inbound: S.inbound,
      events: S.events,
      lvmh: S.lvmh,
      coffeechats: S.coffeechats,
      sugs: S.sugs,
      updated_at: new Date().toISOString()
    };
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      localStorage.setItem('isa_v4', JSON.stringify(S));
      showSyncStatus('☁️ Synced', 'green');
      console.log('Saved to cloud via Netlify Function');
    } else {
      localStorage.setItem('isa_v4', JSON.stringify(S));
      showSyncStatus('📱 Saved locally', 'amber');
    }
  } catch(e) {
    localStorage.setItem('isa_v4', JSON.stringify(S));
    showSyncStatus('📱 Saved locally', 'amber');
  }
}

async function cloudLoad() {
  try {
    const res = await fetch('/api/sync');
    if (res.ok) {
      const data = await res.json();
      if (data && data.length > 0 && data[0].contacts && data[0].contacts.length > 0) {
        const row = data[0];
        S.contacts = row.contacts || [];
        S.inbound = row.inbound || [];
        S.events = row.events || [];
        S.lvmh = row.lvmh || [];
        S.coffeechats = row.coffeechats || [];
        S.sugs = row.sugs || [false,false,false];
        localStorage.setItem('isa_v4', JSON.stringify(S));
        console.log('Loaded from cloud:', S.contacts.length, 'contacts');
        return true;
      }
    }
  } catch(e) {
    console.warn('Cloud load error:', e);
  }
  return false;
}

let _saveTimer = null;
function save() {
  localStorage.setItem('isa_v4', JSON.stringify(S));

}

function showSyncStatus(msg, color) {
  let el = document.getElementById('sync-status');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-status';
    el.style.cssText = 'font-size:10px;padding:3px 10px;border-radius:20px;white-space:nowrap;';

}


function go(p2){ window._currentPage=p2;
  pg=p2;
  document.querySelectorAll('.nav-item').forEach(el=>{el.className=el.className.replace(/\bact-\w+/,'').trim();});
  const el=document.getElementById('nav-'+p2);if(el)el.classList.add('act-'+p2);

  document.getElementById('content').innerHTML='';
  if(p2==='dashboard')rDash();
  else if(p2==='contacts')rContacts();
  else if(p2==='inbound')rInbound();
  else if(p2==='events')rEvents();

  else if(p2==='lvmh')rLVMH();

function dc(d){if(!d)return'due-ok';const x=(new Date(d)-new Date())/864e5;return x<0?'due-overdue':x<7?'due-soon':'due-ok';}
// Function aliases for compatibility
function dueClass(d){ return dc(d); }
function dueLabel(d){ return dl(d); }

function dl(d){if(!d)return'—';const x=Math.round((new Date(d)-new Date())/864e5);if(x<0)return Math.abs(x)+'d overdue';if(x===0)return'Today';if(x===1)return'Tomorrow';return'in '+x+'d';}
function tags(){const t=new Set();[...S.contacts,...S.inbound,...S.events].forEach(x=>(x.tags||[]).forEach(t2=>t.add(t2)));return[...t].sort();}
function rDash(){

  document.getElementById('content').innerHTML=`

      <div class="stat-card"><div class="stat-num">${S.inbound.length}</div><div class="stat-label">Inbound / Mentees</div></div>
      <div class="stat-card"><div class="stat-num">${ov}</div><div class="stat-label">Check-ins Overdue</div></div>
    </div>
    <div>
      <div class="section-label">This Week's Smart Suggestions</div>
      <div class="suggestions-card">
        ${sugs.map((s,i)=>sugItem(s,i)).join('')}
        <div style="text-align:center;margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="refreshSugs()">↻ Refresh</button></div>
      </div>
      <div style="margin-top:20px">
        <div class="section-label">Recent Events</div>
        <div class="upcoming-card">
          ${[...S.events].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3).map(e=>{
            const d=new Date(e.date);
            return `<div class="event-item"><div class="event-date-box"><div class="event-month">${d.toLocaleString('default',{month:'short'})}</div><div class="event-day">${d.getDate()}</div></div><div><div class="event-name">${e.name}</div><div class="event-loc">${e.location} · ${e.type}</div><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${e.tags.slice(0,3).map(t=>`<span class="tag ${tc(t)}">${t}</span>`).join('')}</div></div></div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div>
      <div class="section-label">Inbound Queue</div>
      <div class="inbound-card">
        ${S.inbound.map(i=>`<div class="inbound-item" onclick="oInbound(${i.id})"><div class="inbound-dot ${i.status==='new'?'dot-new':i.status==='active'?'dot-active':'dot-touch'}"></div><div><div class="inbound-name">${i.name}</div><div class="inbound-sub">${i.source} · ${i.tags[0]||''}</div></div><div class="inbound-due ${dc(i.nextCheckin)}">${dl(i.nextCheckin)}</div></div>`).join('')}
        <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" style="width:100%" onclick="openM('inbound')">+ Add Inbound</button></div>
      </div>
      <div style="margin-top:16px">
        <div class="section-label">Priority Follow-ups ☕</div>
        <div class="inbound-card" style="margin-bottom:12px">
          ${S.coffeechats.filter(c=>c.priority).map(i=>`
            <div class="inbound-item" onclick="oCC(${i.id})">
              <div class="inbound-dot" style="background:var(--r4)"></div>
              <div><div class="inbound-name">${i.name}</div><div class="inbound-sub">${i.company}${i.notes?' · '+i.notes.substring(0,35)+(i.notes.length>35?'...':''):''}</div></div>
              <div class="inbound-due ${dueClass(i.nextCheckin||i.lastContact)}" style="white-space:nowrap">${i.lastContact?'Last: '+i.lastContact:'Not yet met'}</div>
            </div>`).join('')}
          <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" style="width:100%" onclick="go('cc')">→ All coffee chats</button></div>
        </div>
      </div>

        </div>

  </div>`;
}
function smartSugs(){
  const now=new Date();
  if(!S.dismissed) S.dismissed=[];
  if(!S.contacted_ids) S.contacted_ids=[];
  
  const scored=S.contacts.filter(c=>{
    if(c.stage==='alumni') return false;
    if(S.dismissed.includes(c.id)) return false;
    if(S.contacted_ids.includes(c.id)) return false;
    // Skip if contacted recently (within 21 days)
    if(c.lastContact){
      const days=Math.floor((now-new Date(c.lastContact))/864e5);
      if(days<21 && !(c.tags&&c.tags.includes('want to connect'))) return false;
    }
    return true;
  }).map(c=>{
    let sc=0,rs='';
    if(c.tags&&c.tags.includes('want to connect')){sc+=1000;rs='⭐ You flagged this person to connect with';}
    if(c.tags&&c.tags.includes('⭐ priority')){sc+=900;if(!rs)rs='⭐ Priority contact';}
    if(c.date){
      const daysAgo=Math.floor((now-new Date(c.date))/864e5);
      if(daysAgo>=0&&daysAgo<=30){sc+=500;if(!rs)rs='Met '+daysAgo+' day'+(daysAgo!==1?'s':'')+' ago — still warm';}
      else if(daysAgo<=60){sc+=300;if(!rs)rs='Met ~'+Math.round(daysAgo/7)+' weeks ago';}
      else if(daysAgo<=120){sc+=150;if(!rs)rs='Met '+Math.round(daysAgo/30)+' months ago';}
      else if(daysAgo>0){sc+=50;if(!rs)rs='Met at '+(c.event||'an event');}
    } else {sc+=200;if(!rs)rs='From your events list — not yet contacted';}
    if(c.tags&&c.tags.includes('C-suite'))sc+=30;
    if(c.tags&&c.tags.includes('senior advisor'))sc+=20;
    if(!rs)rs='Never contacted — time to reach out';
    return{...c,sc,rs};
  });
  
  scored.sort((a,b)=>{
    const aw=a.tags&&a.tags.includes('want to connect')?1:0;
    const bw=b.tags&&b.tags.includes('want to connect')?1:0;
    if(aw!==bw)return bw-aw;
    return b.sc-a.sc;
  });
  return scored.slice(0,3);
}

function load(){
  const DATA_VERSION='v69';
  const stored = localStorage.getItem('isa_data_version');
  
  // Always load local data first — preserve it across version bumps
  try{
    const s = localStorage.getItem('isa_v4');
    if(s){ const p = JSON.parse(s); Object.assign(S, p); }
  }catch(e){ console.warn('Local load error:', e); }

  if(stored !== DATA_VERSION){
    // Version changed — patch but don't wipe if data exists
    if(!S.contacts.length){
      S = {contacts:[],inbound:[],events:[],lvmh:[],coffeechats:[],sugs:[false,false,false]};
      seed();
    }
    patchNotesFromDocs();
    localStorage.setItem('isa_data_version', DATA_VERSION);
    save();
    setTimeout(()=>cloudSave().then(()=>showSyncStatus('☁️ Synced','green')).catch(()=>{}), 2000);
  } else {
    if(!S.contacts.length){ seed(); patchNotesFromDocs(); }
    setTimeout(()=>{
      cloudLoad().then(ok=>{
        if(ok){ showSyncStatus('☁️ Synced','green'); go(window._currentPage||'dashboard'); }
        else { cloudSave().catch(()=>{}); showSyncStatus('📱 Local','amber'); }
      }).catch(()=>showSyncStatus('📱 Local','amber'));
    }, 1000);
  }
}

var pTab='pipeline';
function switchPTab(t){
  pTab=t;
  ['pipeline','calendar'].forEach(function(s){
    var el=document.getElementById('ptab-'+s);
    if(el){if(s===t){el.style.borderColor='var(--r5)';el.style.color='var(--r5)';el.style.background='var(--r5d)';}else{el.style.borderColor='var(--border)';el.style.color='var(--text3)';el.style.background='none';}}
  });
  renderPipelineView();
}

      html+='<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;color:var(--text);margin-bottom:12px">'+m.label+'</div>';
      html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">';
      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){html+='<div style="text-align:center;font-size:10px;color:var(--text3);font-weight:600;padding:4px">'+d+'</div>';});
      html+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
      for(var i=0;i<firstDay;i++) html+='<div></div>';
      for(var d=1;d<=daysInMonth;d++){
        var ds=m.year+'-'+String(m.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        var evts=byDate[ds]||[];
        var isToday=ds==='2026-07-28';
        var bg=isToday?'var(--r5d)':evts.length?'var(--surface2)':'var(--bg)';
        var bc=isToday?'var(--r5)':evts.length?'var(--border2)':'var(--border)';
        html+='<div onclick="'+(evts.length?'showDayDetail(\''+ds+'\')':'')+'" style="min-height:56px;background:'+bg+';border:1px solid '+bc+';border-radius:6px;padding:4px;cursor:'+(evts.length?'pointer':'default')+'">';
        html+='<div style="font-size:11px;font-weight:'+(isToday?'700':'400')+';color:'+(isToday?'var(--r5)':'var(--text2)')+';text-align:right">'+d+'</div>';
        evts.slice(0,3).forEach(function(p){
          html+='<div style="font-size:9px;background:var(--r4d);color:var(--r4);border-radius:3px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+p.name.split(' ')[0]+'</div>';
        });
        if(evts.length>3) html+='<div style="font-size:9px;color:var(--text3);margin-top:1px">+'+(evts.length-3)+'</div>';
        html+='</div>';
      }
      html+='</div></div>';
    });
    c.innerHTML=html;
  }
}

function showDayDetail(dateStr){
  var d=new Date(dateStr+'T12:00:00');
  var label=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  var contacts=S.lvmh.filter(function(p){return p.dueDate===dateStr||p.lastContact===dateStr;});
  var m=document.createElement('div');
  m.className='modal-overlay open';
  var inner='<div class="modal"><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">✕</button><div class="modal-title">'+label+'</div>';
  contacts.forEach(function(p){
    inner+='<div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer" onclick="this.closest(\'.modal-overlay\').remove();oLVMH('+p.id+')">';
    inner+='<div style="font-weight:500;color:var(--text)">'+p.name+'</div>';
    inner+='<div style="font-size:11px;color:var(--text3)">'+(p.role||'')+' · '+p.brand+'</div>';
    if(p.followup) inner+='<div style="font-size:11px;color:var(--r5);margin-top:4px">→ '+p.followup+'</div>';
    inner+='</div>';
  });
  inner+='<div class="modal-actions"><button class="btn btn-ghost" onclick="this.closest(\'.modal-overlay\').remove()">Close</button></div></div>';
  m.innerHTML=inner;
  document.body.appendChild(m);
}



document.addEventListener('DOMContentLoaded', function(){ load(); go('dashboard'); });
</script>
